[settings]
experimental = true
lockfile = true
activate_aggressive = true
always_keep_download = true
idiomatic_version_file_enable_tools = []
env_shell_expand = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[settings.cargo]
binstall = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[env]
_.file = ["~/.dotfiles.env", "~/.env", "~/.config/user-dirs.dirs"]
_.path = ["~/.local/bin"]

PS1 = ": "
PS2 = ".. "
VISUAL = "nvim"
EDITOR = "nvim -u NONE"
PAGER = "bat --plain"
BROWSER = "firefox"

FNOX_AGE_KEY_FILE = "~/.config/fnox/age.txt"
JULIA_PROJECT = "@."
TLRC_CONFIG = "$HOME/.config/tlrc/config.toml"

[shell_alias]
c = "clear"
h = "head"
t = "tail"
p = "pwd"
u = "df -H $HOME"
e = "{{env.EDITOR}}"
v = "{{env.VISUAL}}"

wh = "where"

ai = "pi"
cc = "claude"
claude-nono = "HERDR_AGENT=claude nono run --profile claude-dotfiles --allow-cwd -- claude"
oc = "opencode"
calc = "numbat"
num = "numbat"
mdns = "mdnstool"
jl = "jupyter-lab --no-browser --ip=0.0.0.0"
services = "pitchfork"
vm = "colima"

[tasks.clean]
description = "Clean up system packages and caches"
depends = ["mise:clean", "nix:clean", "brew:clean", "docker:clean", "aube:clean", "mbx:clean", "nvim:clean"]

[tasks.self-update]
depends = ["devbox:self-update", "brew:self-update"]

[tasks.update]
description = "Update all tools and packages"
depends = [
  "chezmoi:update",
  "mise:update",
  "yazi:update",
  "nvim:update",
  "pi:update",
  "nono:update",
  "brew:update",
  "upt:update",
  "agents:update",
]

[tasks."brew:update"]
description = "Update Homebrew global packages"
run = "command -v brew >/dev/null && brew upgrade || exit 0"

[tasks."brew:self-update"]
description = "Update Homebrew"
run = "command -v brew >/dev/null && brew update || exit 0"

[tasks."chezmoi:update"]
description = "Update Chezmoi"
run = "chezmoi upgrade"

[tasks."devbox:self-update"]
description = "Update Devbox"
run = "command -v devbox >/dev/null && devbox version update || exit 0"

[tasks."upt:update"]
description = "Update system packages"
run = [{ task = "upt update" }, { task = "upt upgrade --yes" }]

[tasks."nerd-fonts:list"]
description = "List installed Nerd Fonts"
run = "fc-list | grep Nerd"

[tasks."mise:update"]
alias = "mise:up"
description = "Update Mise global packages and plugins"
run = [
    "mise upgrade",
    "mise plugins upgrade",
    "mise bootstrap packages upgrade --yes",
]

[tasks."mise:clean"]
description = "Clean Mise cache"
run = ["mise prune -y", "mise bootstrap packages prune --manager brew-cask --yes"]

[tasks."nvim:clean"]
description = "Clean Neovim plugins"
run = "nvim --headless '+Lazy! clean' +qa"

[tasks."nvim:install"]
description = "Install Neovim plugins"
alias = "nvim:i"
run = "nvim --headless '+Lazy! install' +qa"

[tasks."nvim:sync"]
description = "Sync Neovim plugins"
run = "nvim --headless '+Lazy! sync' +qa"

[tasks."nvim:update"]
description = "Update Neovim plugins"
alias = "nvim:up"
run = "nvim --headless '+Lazy! update' +qa"

[tasks."pi:update"]
alias = "pi:up"
run = "pi update --extensions"

[tasks."nono:update"]
alias = "nono:up"
description = "Update nono packs"
run = "nono update"

[tasks."yazi:install"]
alias = "yazi:i"
description = "Install Yazi packages"
run = "ya pkg install --discard"

[tasks."yazi:update"]
alias = "yazi:up"
description = "Update Yazi packages"
run = "ya pkg upgrade"

[tasks."agents:update"]
description = "Update agents resources"
run = "skills update --global --yes"

[tasks."aube:clean"]
description = "Prune unreferenced packages from the aube store"
run = "aube store prune"

[tasks."mbx:clean"]
description = "Evict mr-boxington cache down to its configured budget"
run = "mbx gc"

[tasks."python:scaffold"]
description = "Scaffold a Python project with uv and pytest"
dir = "{{cwd}}"
run = [{ task = "python:init" }, { task = "python:tasks-add" }]

[tasks.random-hex]
description = "Generate a 32-bit random hex number"
alias = "rhex"
run = "openssl rand -hex 32| cut -c -7"

[tasks.zippdf]
description = "Compress PDF files in the current directory recursively"
run = "find -type f -iname '*.pdf' -exec gzip -vf {} +"

